<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota&Ganho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#14171A; --bg-1:#1E2225; --bg-2:#262B2F;
    --accent:#FFC247; --accent-dim:#3A2F16;
    --success:#5FBE8B; --success-dim:#16241C;
    --danger:#E2604F; --danger-dim:#2A1815;
    --text-0:#F3F2ED; --text-1:#9CA0A3; --text-2:#6B6F72;
    --border:#2C3135;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg-0); color:var(--text-0); font-family:var(--sans);}
  body{display:flex; justify-content:center; min-height:100vh;}
  #app{width:100%; max-width:430px; min-height:100vh; display:flex; flex-direction:column; background:var(--bg-0); position:relative;}

  /* topbar */
  .topbar{padding:20px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .topbar h1{font-size:17px; font-weight:600; letter-spacing:.2px;}
  .topbar .tag{font-family:var(--mono); font-size:11px; color:var(--text-2); border:1px solid var(--border); padding:3px 8px; border-radius:20px;}

  main{flex:1; padding:0 20px 100px; overflow-y:auto;}
  section{display:none;}
  section.active{display:block;}

  /* route-line divider motif */
  .route-line{height:14px; margin:18px 0; display:flex; align-items:center; gap:6px;}
  .route-line span{width:5px; height:2px; background:var(--border); border-radius:2px;}

  /* period chips */
  .chips{display:flex; gap:8px; margin-bottom:16px;}
  .chip{font-family:var(--mono); font-size:12px; padding:7px 13px; border-radius:20px; border:1px solid var(--border); color:var(--text-1); cursor:pointer; background:transparent;}
  .chip.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}

  /* meter card */
  .meter{background:var(--bg-1); border:1px solid var(--border); border-radius:16px; padding:22px 20px;}
  .meter .label{font-size:12px; color:var(--text-1); letter-spacing:.4px; margin-bottom:6px;}
  .meter .value{font-family:var(--mono); font-size:38px; font-weight:500; color:var(--accent); line-height:1.1;}
  .meter .sub{display:flex; gap:18px; margin-top:14px; font-family:var(--mono); font-size:13px;}
  .meter .sub div span{display:block; color:var(--text-2); font-size:11px; font-family:var(--sans); margin-bottom:2px;}

  .split{display:flex; gap:12px; margin-top:14px;}
  .split .card{flex:1; background:var(--bg-1); border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .split .card .label{font-size:12px; color:var(--text-1); margin-bottom:6px;}
  .split .card .value{font-family:var(--mono); font-size:19px; font-weight:500;}

  h2.section-title{font-size:13px; color:var(--text-1); font-weight:500; margin:22px 0 10px;}

  .entry{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
  .entry:last-child{border-bottom:none;}
  .entry .info .place{font-size:14px; margin-bottom:2px;}
  .entry .info .date{font-size:11px; color:var(--text-2); font-family:var(--mono);}
  .entry .amount{font-family:var(--mono); font-size:14px; font-weight:500;}
  .entry .amount.rota{color:var(--text-0);}
  .entry .amount.app{color:var(--success);}
  .entry .amount.despesa{color:var(--danger);}
  .entry .del{background:none; border:none; color:var(--text-2); font-size:16px; margin-left:12px; cursor:pointer; padding:4px 6px;}
  .empty{color:var(--text-2); font-size:13px; padding:24px 0; text-align:center;}

  /* registrar */
  .type-select{display:flex; gap:8px; margin-bottom:20px;}
  .type-btn{flex:1; padding:12px 0; border-radius:12px; border:1px solid var(--border); background:var(--bg-1); color:var(--text-1); font-size:13px; font-weight:500; cursor:pointer;}
  .type-btn.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--text-1); margin-bottom:7px;}
  .field input, .field select{width:100%; background:var(--bg-1); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text-0); font-family:var(--sans); font-size:15px;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
  .field .err{color:var(--danger); font-size:12px; margin-top:6px; display:none;}

  .app-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .app-chip{padding:9px 16px; border-radius:20px; border:1px solid var(--border); background:var(--bg-1); color:var(--text-1); font-size:13px; cursor:pointer;}
  .app-chip.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}

  .save-btn{width:100%; padding:15px 0; border-radius:12px; border:none; background:var(--accent); color:#1B1500; font-weight:600; font-size:15px; cursor:pointer; margin-top:6px;}
  .save-btn:active{opacity:.85;}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--bg-2); border:1px solid var(--accent); color:var(--text-0); font-size:13px; padding:10px 18px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .25s; max-width:390px;}
  .toast.show{opacity:1;}

  /* historico */
  .subtabs{display:flex; gap:8px; margin-bottom:16px;}
  .subtab{font-size:12px; padding:7px 13px; border-radius:20px; border:1px solid var(--border); color:var(--text-1); background:transparent; cursor:pointer;}
  .subtab.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .filters{display:flex; gap:8px; margin-bottom:6px;}

  .month-card{background:var(--bg-1); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .month-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer;}
  .month-head .name{font-size:14px; font-weight:500; text-transform:capitalize;}
  .month-head .liquido{font-family:var(--mono); color:var(--accent); font-size:14px;}
  .month-body{display:none; padding:0 16px 14px; border-top:1px solid var(--border);}
  .month-body.open{display:block;}
  .week-row{display:flex; justify-content:space-between; padding:10px 0; font-size:13px; border-bottom:1px solid var(--border);}
  .week-row:last-child{border-bottom:none;}
  .week-row .w-liquido{font-family:var(--mono); color:var(--text-1);}

  /* bottom nav */
  nav.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--bg-1); border-top:1px solid var(--border); display:flex; padding:10px 12px 16px;}
  nav.tabbar button{flex:1; background:none; border:none; color:var(--text-2); font-family:var(--sans); font-size:11px; padding:6px 0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;}
  nav.tabbar button .dot{width:5px; height:5px; border-radius:50%; background:transparent;}
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar button.active .dot{background:var(--accent);}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <h1>Rota&amp;Ganho</h1>
    <span class="tag" id="statusTag">carregando…</span>
  </div>

  <main>

    <!-- DASHBOARD -->
    <section id="sec-dashboard" class="active">
      <div class="chips" id="periodChips">
        <button class="chip active" data-period="hoje">Hoje</button>
        <button class="chip" data-period="semana">Semana</button>
        <button class="chip" data-period="mes">Mês</button>
      </div>

      <div class="meter">
        <div class="label">Total líquido</div>
        <div class="value" id="mLiquido">R$ 0,00</div>
        <div class="sub">
          <div><span>Bruto</span><span id="mBruto">R$ 0,00</span></div>
          <div><span>Despesas</span><span id="mDespesas">R$ 0,00</span></div>
        </div>
      </div>

      <div class="split">
        <div class="card">
          <div class="label">Rotas</div>
          <div class="value" id="mRotas">R$ 0,00</div>
        </div>
        <div class="card">
          <div class="label">Apps</div>
          <div class="value" id="mApps">R$ 0,00</div>
        </div>
      </div>

      <div class="route-line"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

      <h2 class="section-title">Últimos lançamentos</h2>
      <div id="recentList"></div>
    </section>

    <!-- REGISTRAR -->
    <section id="sec-registrar">
      <h2 class="section-title" style="margin-top:4px;">Novo lançamento</h2>
      <div class="type-select">
        <button class="type-btn active" data-type="rota">Rota</button>
        <button class="type-btn" data-type="app">App</button>
        <button class="type-btn" data-type="despesa">Despesa</button>
      </div>

      <form id="formRota">
        <div class="field"><label>Data</label><input type="date" id="rotaData"></div>
        <div class="field"><label>Local / descrição</label><input type="text" id="rotaLocal" placeholder="Ex: Coleta MAERSK"></div>
        <div class="field"><label>Valor (R$)</label><input type="number" id="rotaValor" step="0.01" value="30"></div>
        <div class="field err" id="rotaErr">Preencha data, local e valor.</div>
        <button type="button" class="save-btn" id="btnSalvarRota">Salvar rota</button>
      </form>

      <form id="formApp" style="display:none;">
        <div class="field"><label>Data</label><input type="date" id="appData"></div>
        <div class="field"><label>Aplicativo</label>
          <div class="app-chips" id="appChips">
            <button type="button" class="app-chip active" data-app="Uber">Uber</button>
            <button type="button" class="app-chip" data-app="99Pop">99Pop</button>
          </div>
        </div>
        <div class="field"><label>Ganho total do dia (R$)</label><input type="number" id="appValor" step="0.01"></div>
        <div class="field err" id="appErr">Preencha data e valor.</div>
        <button type="button" class="save-btn" id="btnSalvarApp">Salvar ganho do app</button>
      </form>

      <form id="formDespesa" style="display:none;">
        <div class="field"><label>Data</label><input type="date" id="despData"></div>
        <div class="field"><label>Categoria</label>
          <select id="despCategoria">
            <option>Combustível</option>
            <option>Óleo</option>
            <option>Manutenção</option>
            <option>Outra</option>
          </select>
        </div>
        <div class="field"><label>Valor (R$)</label><input type="number" id="despValor" step="0.01"></div>
        <div class="field"><label>Descrição (opcional)</label><input type="text" id="despDescricao"></div>
        <div class="field err" id="despErr">Preencha data e valor.</div>
        <button type="button" class="save-btn" id="btnSalvarDespesa">Salvar despesa</button>
      </form>
    </section>

    <!-- HISTORICO -->
    <section id="sec-historico">
      <div class="subtabs">
        <button class="subtab active" data-sub="lista">Lançamentos</button>
        <button class="subtab" data-sub="meses">Por mês</button>
      </div>

      <div id="histLista">
        <div class="filters" id="histFilters">
          <button class="chip active" data-f="todos">Todos</button>
          <button class="chip" data-f="rota">Rotas</button>
          <button class="chip" data-f="app">Apps</button>
          <button class="chip" data-f="despesa">Despesas</button>
        </div>
        <div id="histListContent"></div>
      </div>

      <div id="histMeses" style="display:none;"></div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <nav class="tabbar">
    <button class="tab-btn active" data-target="dashboard"><span class="dot"></span>Painel</button>
    <button class="tab-btn" data-target="registrar"><span class="dot"></span>Registrar</button>
    <button class="tab-btn" data-target="historico"><span class="dot"></span>Histórico</button>
  </nav>

</div>

<script>
// ---------- estado ----------
let rotas = [];
let despesas = [];
let ganhosApp = [];
let storageOk = true;

const fmt = v => (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const todayISO = () => new Date().toISOString().slice(0,10);

// ---------- persistencia ----------
async function loadAll(){
  try{
    const r = await window.storage.get('rotas');
    rotas = r ? JSON.parse(r.value) : [];
  }catch(e){ rotas = []; }
  try{
    const d = await window.storage.get('despesas');
    despesas = d ? JSON.parse(d.value) : [];
  }catch(e){ despesas = []; }
  try{
    const a = await window.storage.get('ganhosApp');
    ganhosApp = a ? JSON.parse(a.value) : [];
  }catch(e){ ganhosApp = []; }
}

async function persist(key, data){
  try{
    await window.storage.set(key, JSON.stringify(data), false);
    document.getElementById('statusTag').textContent = 'salvo';
    storageOk = true;
  }catch(e){
    storageOk = false;
    document.getElementById('statusTag').textContent = 'sem armazenamento';
  }
}

// ---------- lógica de dados ----------
function addRota(data, local, valor){
  rotas.push({ id: Date.now(), data, local, valor });
  persist('rotas', rotas);
}

function setGanhoApp(data, app, valor){
  const idx = ganhosApp.findIndex(g => g.data === data);
  if(idx === -1){
    ganhosApp.push({ data, app, valor });
  } else {
    ganhosApp[idx] = { data, app, valor };
  }
  persist('ganhosApp', ganhosApp);
}

function addDespesa(data, categoria, valor, descricao){
  despesas.push({ id: Date.now(), data, categoria, valor, descricao });
  persist('despesas', despesas);
}

function deleteEntry(tipo, idOrData){
  if(tipo === 'rota'){ rotas = rotas.filter(r => r.id !== idOrData); persist('rotas', rotas); }
  if(tipo === 'despesa'){ despesas = despesas.filter(d => d.id !== idOrData); persist('despesas', despesas); }
  if(tipo === 'app'){ ganhosApp = ganhosApp.filter(a => a.data !== idOrData); persist('ganhosApp', ganhosApp); }
  renderAll();
}

// intervalo do período selecionado
function periodRange(period){
  const now = new Date();
  const start = new Date(now); const end = new Date(now);
  if(period === 'hoje'){
    // start = end = hoje
  } else if(period === 'semana'){
    const dow = now.getDay(); // 0=domingo
    const diffToMonday = (dow === 0 ? 6 : dow - 1);
    start.setDate(now.getDate() - diffToMonday);
  } else if(period === 'mes'){
    start.setDate(1);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

function inRange(dateStr, start, end){
  return dateStr >= start && dateStr <= end;
}

function sumRotas(start, end){
  return rotas.filter(r => inRange(r.data, start, end)).reduce((s,r)=>s+Number(r.valor),0);
}
function sumApps(start, end){
  return ganhosApp.filter(a => inRange(a.data, start, end)).reduce((s,a)=>s+Number(a.valor),0);
}
function sumDespesas(start, end){
  return despesas.filter(d => inRange(d.data, start, end)).reduce((s,d)=>s+Number(d.valor),0);
}

// ---------- render: dashboard ----------
let currentPeriod = 'hoje';

function renderDashboard(){
  const { start, end } = periodRange(currentPeriod);
  const bruto = sumRotas(start,end) + sumApps(start,end);
  const desp = sumDespesas(start,end);
  document.getElementById('mLiquido').textContent = fmt(bruto - desp);
  document.getElementById('mBruto').textContent = fmt(bruto);
  document.getElementById('mDespesas').textContent = fmt(desp);
  document.getElementById('mRotas').textContent = fmt(sumRotas(start,end));
  document.getElementById('mApps').textContent = fmt(sumApps(start,end));

  const all = [
    ...rotas.map(r => ({ tipo:'rota', data:r.data, texto:r.local, valor:r.valor, id:r.id })),
    ...ganhosApp.map(a => ({ tipo:'app', data:a.data, texto:a.app, valor:a.valor, id:a.data })),
    ...despesas.map(d => ({ tipo:'despesa', data:d.data, texto:d.categoria, valor:d.valor, id:d.id }))
  ].sort((a,b) => b.data.localeCompare(a.data) || b.id - a.id).slice(0,6);

  const list = document.getElementById('recentList');
  list.innerHTML = all.length ? '' : '<div class="empty">Nada lançado ainda. Toque em Registrar para começar.</div>';
  all.forEach(e => list.appendChild(entryRow(e, false)));
}

function entryRow(e, withDelete){
  const div = document.createElement('div');
  div.className = 'entry';
  const sign = e.tipo === 'despesa' ? '-' : '+';
  div.innerHTML = `
    <div class="info">
      <div class="place">${e.texto || '—'}</div>
      <div class="date">${e.data}</div>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="amount ${e.tipo}">${sign} ${fmt(e.valor)}</div>
    </div>`;
  if(withDelete){
    const btn = document.createElement('button');
    btn.className = 'del'; btn.textContent = '×';
    btn.onclick = () => deleteEntry(e.tipo, e.id);
    div.querySelector('div[style]').appendChild(btn);
  }
  return div;
}

// ---------- render: historico lista ----------
let histFilter = 'todos';

function renderHistLista(){
  const all = [
    ...rotas.map(r => ({ tipo:'rota', data:r.data, texto:r.local, valor:r.valor, id:r.id })),
    ...ganhosApp.map(a => ({ tipo:'app', data:a.data, texto:a.app, valor:a.valor, id:a.data })),
    ...despesas.map(d => ({ tipo:'despesa', data:d.data, texto:d.categoria, valor:d.valor, id:d.id }))
  ].filter(e => histFilter === 'todos' || e.tipo === histFilter)
   .sort((a,b) => b.data.localeCompare(a.data) || b.id - a.id);

  const cont = document.getElementById('histListContent');
  cont.innerHTML = all.length ? '' : '<div class="empty">Nenhum lançamento com esse filtro.</div>';
  all.forEach(e => cont.appendChild(entryRow(e, true)));
}

// ---------- render: historico por mes ----------
function monthKey(d){ return d.slice(0,7); }
function mondayOfWeek(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay();
  const diff = (dow === 0 ? 6 : dow - 1);
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0,10);
}
const mesesNomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function renderHistMeses(){
  const allDates = new Set([
    ...rotas.map(r=>r.data), ...ganhosApp.map(a=>a.data), ...despesas.map(d=>d.data)
  ]);
  const months = {};
  allDates.forEach(dt => { months[monthKey(dt)] = true; });
  const monthList = Object.keys(months).sort().reverse();

  const cont = document.getElementById('histMeses');
  if(!monthList.length){ cont.innerHTML = '<div class="empty">Sem dados ainda.</div>'; return; }
  cont.innerHTML = '';

  monthList.forEach(mk => {
    const [ano, mesNum] = mk.split('-');
    const start = mk + '-01';
    const end = mk + '-31';
    const bruto = sumRotas(start,end) + sumApps(start,end);
    const desp = sumDespesas(start,end);

    const card = document.createElement('div');
    card.className = 'month-card';
    card.innerHTML = `
      <div class="month-head">
        <div class="name">${mesesNomes[Number(mesNum)-1]} / ${ano}</div>
        <div class="liquido">${fmt(bruto-desp)}</div>
      </div>
      <div class="month-body"></div>`;

    const body = card.querySelector('.month-body');
    const weeks = {};
    [...rotas, ...ganhosApp, ...despesas].filter(e => monthKey(e.data) === mk).forEach(e => {
      const wk = mondayOfWeek(e.data);
      weeks[wk] = true;
    });
    Object.keys(weeks).sort().reverse().forEach(wStart => {
      const wEnd = new Date(wStart + 'T00:00:00');
      wEnd.setDate(wEnd.getDate() + 6);
      const wEndStr = wEnd.toISOString().slice(0,10);
      const wBruto = sumRotas(wStart, wEndStr) + sumApps(wStart, wEndStr);
      const wDesp = sumDespesas(wStart, wEndStr);
      const row = document.createElement('div');
      row.className = 'week-row';
      row.innerHTML = `<span>Semana de ${wStart.slice(8,10)}/${wStart.slice(5,7)}</span><span class="w-liquido">${fmt(wBruto-wDesp)}</span>`;
      body.appendChild(row);
    });

    card.querySelector('.month-head').onclick = () => body.classList.toggle('open');
    cont.appendChild(card);
  });
}

function renderAll(){
  renderDashboard();
  renderHistLista();
  renderHistMeses();
}

// ---------- toast ----------
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- navegação ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main > section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-' + btn.dataset.target).classList.add('active');
  });
});

document.querySelectorAll('#periodChips .chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('#periodChips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    currentPeriod = c.dataset.period;
    renderDashboard();
  });
});

document.querySelectorAll('.subtab').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));
    s.classList.add('active');
    document.getElementById('histLista').style.display = s.dataset.sub === 'lista' ? 'block' : 'none';
    document.getElementById('histMeses').style.display = s.dataset.sub === 'meses' ? 'block' : 'none';
  });
});

document.querySelectorAll('#histFilters .chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('#histFilters .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    histFilter = c.dataset.f;
    renderHistLista();
  });
});

// ---------- registrar: seleção de tipo ----------
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('formRota').style.display = btn.dataset.type === 'rota' ? 'block' : 'none';
    document.getElementById('formApp').style.display = btn.dataset.type === 'app' ? 'block' : 'none';
    document.getElementById('formDespesa').style.display = btn.dataset.type === 'despesa' ? 'block' : 'none';
  });
});

let appSelecionado = 'Uber';
document.querySelectorAll('.app-chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.app-chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    appSelecionado = c.dataset.app;
  });
});

// ---------- registrar: salvar ----------
document.getElementById('btnSalvarRota').addEventListener('click', () => {
  const data = document.getElementById('rotaData').value;
  const local = document.getElementById('rotaLocal').value.trim();
  const valor = Number(document.getElementById('rotaValor').value);
  const err = document.getElementById('rotaErr');
  if(!data || !local || !valor){ err.style.display = 'block'; return; }
  err.style.display = 'none';
  addRota(data, local, valor);
  document.getElementById('rotaLocal').value = '';
  renderAll();
  showToast('Rota registrada');
});

document.getElementById('btnSalvarApp').addEventListener('click', () => {
  const data = document.getElementById('appData').value;
  const valor = Number(document.getElementById('appValor').value);
  const err = document.getElementById('appErr');
  if(!data || !valor){ err.style.display = 'block'; return; }
  err.style.display = 'none';
  setGanhoApp(data, appSelecionado, valor);
  document.getElementById('appValor').value = '';
  renderAll();
  showToast('Ganho de app registrado');
});

document.getElementById('btnSalvarDespesa').addEventListener('click', () => {
  const data = document.getElementById('despData').value;
  const categoria = document.getElementById('despCategoria').value;
  const valor = Number(document.getElementById('despValor').value);
  const descricao = document.getElementById('despDescricao').value.trim();
  const err = document.getElementById('despErr');
  if(!data || !valor){ err.style.display = 'block'; return; }
  err.style.display = 'none';
  addDespesa(data, categoria, valor, descricao);
  document.getElementById('despValor').value = '';
  document.getElementById('despDescricao').value = '';
  renderAll();
  showToast('Despesa registrada');
});

// ---------- init ----------
(async function init(){
  document.getElementById('rotaData').value = todayISO();
  document.getElementById('appData').value = todayISO();
  document.getElementById('despData').value = todayISO();
  await loadAll();
  document.getElementById('statusTag').textContent = 'pronto';
  renderAll();
})();
</script>
</body>
</html>
